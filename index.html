<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSL Bussiseuranta</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            box-shadow: 0 2px 6px rgba(0,0,0,.2);
        }
    </style>
</head>
<body>

<div class="info">
    <strong>HSL Bussiseuranta</strong><br>
    Päivittyy 5 sekunnin välein
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// Alustetaan kartta Helsingin kohdalle
const map = L.map('map').setView([60.1699, 24.9384], 12);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// Tallennetaan kartalla olevat merkit, jotta niitä voidaan liikuttaa eikä luoda aina uusia
const vehicleMarkers = {};

// MUISTA LAITTAA TÄHÄN OMA DIGITRANSIT-API-AVAIN
const API_KEY = "077ec890e32c460eb1ba91e210a9901f"; 

async function loadVehicles() {
    // Jos API-avainta ei ole vaihdettu, varoitetaan konsolissa
    if (API_KEY === "REMPPAA_TÄHÄN_OMA_API_AVAIN") {
        console.error("Muista syöttää oma Digitransit-API-avain muuttujaan 'API_KEY'!");
        return;
    }

    try {
        // Käytetään Siri VM HTTP-rajapintaa GraphQL:n sijaan
        const response = await fetch(
            "https://api.digitransit.fi/realtime/v1/utils/vessel-positions",
            {
                method: "GET",
                headers: {
                    "digitransit-subscription-key": API_KEY
                }
            }
        );

        if (!response.ok) {
            throw new Error(`HTTP virhe! Status: ${response.status}`);
        }

        const data = await response.json();
        
        // HSL:n data löytyy polusta: data.vesselPositions
        const vehicles = data.vesselPositions || [];

        vehicles.forEach(v => {
            // Rajataan varmuuden vuoksi vain bussit/ratikat jne. joilla on koordinaatit
            if (!v.lat || !v.lng || !v.id) return;

            const lat = v.lat;
            const lon = v.lng;
            const lineName = v.signerRoute || v.routeId || "?";

            if (!vehicleMarkers[v.id]) {
                // Luodaan uusi markeri jos sitä ei ole vielä olemassa
                vehicleMarkers[v.id] = L.marker([lat, lon]).addTo(map);
            } else {
                // Päivitetään olemassa olevan markerin sijainti suoraan (bussi "liikkuu")
                vehicleMarkers[v.id].setLatLng([lat, lon]);
            }

            // Päivitetään ponnahdusikkunan teksti (esim. "Linja 550")
            vehicleMarkers[v.id].bindPopup(`<b>Linja:</b> ${lineName}`);
        });

    } catch (error) {
        console.error("Virhe haettaessa busseja:", error);
    }
}

// Haetaan heti alussa ja sen jälkeen 5 sekunnin välein
loadVehicles();
setInterval(loadVehicles, 5000);
</script>

</body>
</html>
