<!DOCTYPE html>
<html lang="fi">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSL Bussiseuranta</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            box-shadow: 0 2px 6px rgba(0,0,0,.2);
        }
    </style>
</head>
<body>

<div class="info">
    <strong>HSL Bussiseuranta</strong><br>
    Päivittyy 10 sekunnin välein
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([60.1699, 24.9384], 11);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(map);


    

const vehicleMarkers = {};

async function loadVehicles() {
    const response = await fetch(
        "https://api.digitransit.fi/routing/v2/routers/hsl/index/graphql",
        {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "digitransit-subscription-key": "077ec890e32c460eb1ba91e210a9901f"
            },
            body: JSON.stringify({
                query: `
                {
                  vehicles {
                    id
                    lat
                    lon
                    trip {
                      routeShortName
                    }
                  }
                }
                `
            })
        }
    );

    const data = await response.json();
    const vehicles = data.data.vehicles;

    vehicles.forEach(v => {
        if (!vehicleMarkers[v.id]) {
            vehicleMarkers[v.id] = L.marker([v.lat, v.lon]).addTo(map);
        } else {
            vehicleMarkers[v.id].setLatLng([v.lat, v.lon]);
        }

        vehicleMarkers[v.id].bindPopup("Linja " + (v.trip?.routeShortName || "?"));
    });
}

loadVehicles();
setInterval(loadVehicles, 5000);
</script>

</body>
</html>
